name: Test PyPI build

"on":
  schedule:
    - cron: "0 1 * * *"
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_pypi_build:
    name: Test PyPI build (${{ matrix.os }}, ${{ matrix.install_target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install_target: base
            extra_selector: ""
          - os: ubuntu-latest
            install_target: all
            extra_selector: "[all]"
          - os: macos-latest
            install_target: base
            extra_selector: ""
          - os: macos-latest
            install_target: all
            extra_selector: "[all]"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel in clean virtual environment
        run: |
          python -m venv .venv-pypi-smoke
          source .venv-pypi-smoke/bin/activate
          python -m pip install --upgrade pip
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' | head -n 1)"
          python -m pip install "${wheel_path}${{ matrix.extra_selector }}"
          python -m pip install pytest pytest-mock mock
      - name: Run pure PyPI smoke checks
        run: |
          source .venv-pypi-smoke/bin/activate
          python -c "import queens"
          pytest -v -m "unit_tests" tests/unit_tests/

  ensure_all_pypi_builds_pass:
    name: Ensure all PyPI builds pass
    needs: test_pypi_build
    runs-on: ubuntu-latest
    if: always() && github.ref != 'refs/heads/main'
    steps:
      - name: Check for successful PyPI builds
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
